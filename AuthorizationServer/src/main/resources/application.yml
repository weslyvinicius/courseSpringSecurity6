server:
  port: 8080

spring:
  application:
    name: oauth2-authorization-server-demo
  # ===== JPA/HIBERNATE CONFIGURATION =====
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate.ddl-auto: create-drop
    show-sql: true
    properties.hibernate.format_sql: true
    defer-datasource-initialization: true
  # ===== H2 CONSOLE CONFIGURATION =====
  h2:
    console.enabled: true
    console.path: /h2-console
    console.settings.trace: false
    console.settings.web-allow-others: false
  # ===== DATASOURCE CONFIGURATION (H2) =====
  datasource.url: jdbc:h2:mem:testdb
  datasource.driverClassName: org.h2.Driver
  datasource.username: sa
  datasource.password: password

logging:
  level:
    # Log para sua aplicação
    org.springframework.web: DEBUG
    # Configuração de logging para Spring Security
    org.springframework.security: DEBUG
    org.springframework.security.access: TRACE
    org.springframework.security.oauth2: DEBUG
    # Log detalhado para autorização
    org.springframework.security.web.FilterChainProxy: DEBUG
    org.springframework.security.web.access.expression: TRACE
    # ===== JPA =====
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
